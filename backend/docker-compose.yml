version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hayirhah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hayirhah_db
      POSTGRES_USER: hayirhah_user
      POSTGRES_PASSWORD: hayirhah_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - hayirhah-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayirhah_user -d hayirhah_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: hayirhah-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hayirhah-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Database management UI
  adminer:
    image: adminer:latest
    container_name: hayirhah-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - hayirhah-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hayirhah-network:
    driver: bridge 